<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sefineh Electronics</title>
  <link rel="icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Dark is the default look. The saved choice is applied before first paint.
    try {
      if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark')
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#shop">
      <span class="logo-mark" role="img" aria-label="Sefineh Electronics logo"></span>
      <span id="storeName"></span>
    </a>
    <input id="search" type="search" placeholder="Search products..." aria-label="Search products">
    <nav id="nav"></nav>
    <a class="icon" href="#cart" aria-label="Cart">&#128722; <span id="cartCount" class="badge" hidden></span></a>
    <a class="icon" id="bell" href="#notifications" aria-label="Notifications" hidden>&#128276; <span id="bellCount" class="badge" hidden></span></a>
    <span id="who"></span>
    <button id="auth"></button>
    <button id="lang" aria-label="Language">አማ</button>
    <button id="theme" aria-label="Toggle theme">Theme</button>
  </header>
  <main id="view"></main>
  <footer id="footer"></footer>
  <div id="flash" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
